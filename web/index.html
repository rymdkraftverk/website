      href="patchy-robots.otf"
      as="font"

      crossorigin
    />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="icon-email" viewBox="0 0 24 24">
        <path
          d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"

        <path
          d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
        />

      <symbol id="icon-x" viewBox="0 0 24 24">
        <path
          d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"
        />

    <div class="stars" aria-hidden="true"></div>
    <img class="comet" src="comet.webp" alt="" />
    <nav class="nav">
      <a href="team.html"><span class="team">Team</span></a>
    </nav>
    <header>
      <h1 class="title"><span class="brand">Rymdkraftverk</span></h1>
    </header>
    <main>
      <div class="projects">
        <a
          class="project"
          href="https://tails.rymdkraftverk.com/"
          target="_blank"
          aria-label="Play Tails"
        >
          <video
            class="project-media"
            autoplay
            muted
            loop
            playsinline
            poster="tails.jpg"
            width="320"
            height="238"
          >
            <source src="tails.webm" type="video/webm" />
            <source src="tails.mp4" type="video/mp4" />
          </video>
        </a>
        <a
          class="project"
          href="https://sticky-feet.rymdkraftverk.com/"
          target="_blank"
          aria-label="Play Sticky Feet"
        >
          <video
            class="project-media"
            autoplay
            muted
            loop
            playsinline
            poster="sticky-feet.jpg"
            width="320"
            height="238"
          >
            <source src="sticky-feet.webm" type="video/webm" />
            <source src="sticky-feet.mp4" type="video/mp4" />
          </video>
        </a>
      </div>
      <div class="video-section">
        <button
          class="yt-video"
          type="button"
          data-video-id="ADqLBc1vFwI"
          aria-label="Play: Hitler reacts to functional programming"
        >
          <img
            src="video-poster.jpg"
            alt=""
            width="1160"
            height="653"
            loading="lazy"
          />
          <span class="yt-play" aria-hidden="true"></span>
        </button>
      </div>
    </main>
    <footer>
      <div class="contact">
        <a href="mailto:contact@rymdkraftverk.com" aria-label="Email us">
          <svg class="icon"><use href="#icon-email" /></svg>
        </a>
        <a
          href="https://github.com/rymdkraftverk"
          target="_blank"
          aria-label="Visit our GitHub"
        >
          <svg class="icon"><use href="#icon-github" /></svg>
        </a>
        <a
          href="https://x.com/rymdkraftverk"
          target="_blank"
          aria-label="Follow us on X"
        >
          <svg class="icon"><use href="#icon-x" /></svg>
        </a>
      </div>
      <p class="copyright">© 2026 Rymdkraftverk</p>
    </footer>
    <script>
      document.querySelector(".yt-video").addEventListener("click", (e) => {
        const button = e.currentTarget;
        const iframe = document.createElement("iframe");
        iframe.className = "yt-video";
        iframe.src = `https://www.youtube-nocookie.com/embed/${button.dataset.videoId}?autoplay=1`;
        iframe.title = "Hitler reacts to functional programming";
        iframe.allow = "autoplay; fullscreen";
        iframe.allowFullscreen = true;
        button.replaceWith(iframe);
      });
    </script>
    <script src="space.js"></script>
  </body>
</html>
