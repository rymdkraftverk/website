<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Rymdkraftverk - Digital Experiences & Creative Technology. Creating interactive storytelling experiences and experimental game mechanics."
    />
    <meta
      name="keywords"
      content="Rymdkraftverk, digital experiences, creative technology, interactive storytelling, game development"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rymdkraftverk.com/" />
    <meta property="og:title" content="Rymdkraftverk" />
    <meta
      property="og:description"
      content="Digital Experiences & Creative Technology. Creating interactive storytelling experiences and experimental game mechanics."
    />
    <meta property="og:image" content="https://rymdkraftverk.com/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://rymdkraftverk.com/" />
    <meta property="twitter:title" content="Rymdkraftverk" />
    <meta
      property="twitter:description"
      content="Digital Experiences & Creative Technology. Creating interactive storytelling experiences and experimental game mechanics."
    />
    <meta
      property="twitter:image"
      content="https://rymdkraftverk.com/logo.png"
    />

    <title>Rymdkraftverk - Digital Experiences</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="index.css" />
    <link
      rel="preload"
      href="patchy-robots.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
  </head>
  <body>
    <nav class="nav">
      <a href="team.html">Team</a>
    </nav>
    <header>
      <h1 class="title">Rymdkraftverk</h1>
    </header>
    <main>
      <div class="projects">
        <a
          class="project"
          href="https://tails.rymdkraftverk.com/"
          target="_blank"
          aria-label="Play Tails"
        >
          <video
            class="project-media"
            autoplay
            muted
            loop
            playsinline
            poster="tails.jpg"
            width="320"
            height="238"
          >
            <source src="tails.webm" type="video/webm" />
            <source src="tails.mp4" type="video/mp4" />
          </video>
        </a>
        <a
          class="project"
          href="https://sticky-feet.rymdkraftverk.com/"
          target="_blank"
          aria-label="Play Sticky Feet"
        >
          <video
            class="project-media"
            autoplay
            muted
            loop
            playsinline
            poster="sticky-feet.jpg"
            width="320"
            height="238"
          >
            <source src="sticky-feet.webm" type="video/webm" />
            <source src="sticky-feet.mp4" type="video/mp4" />
          </video>
        </a>
      </div>
      <div class="video-section">
        <button
          class="yt-video"
          type="button"
          data-video-id="ADqLBc1vFwI"
          aria-label="Play: Hitler reacts to functional programming"
        >
          <img
            src="video-poster.jpg"
            alt=""
            width="1160"
            height="653"
            loading="lazy"
          />
          <span class="yt-play" aria-hidden="true"></span>
        </button>
      </div>
    </main>
    <footer>
      <hr class="footer-separator" />
      <div class="contact">
        <a href="mailto:contact@rymdkraftverk.com" aria-label="Email us">
          <img src="email.png" alt="Email" />
        </a>

        <a
          href="https://github.com/rymdkraftverk"
          target="_blank"
          aria-label="Visit our GitHub"
        >
          <img src="github.png" alt="GitHub" />
        </a>

        <a
          href="https://x.com/rymdkraftverk"
          target="_blank"
          aria-label="Follow us on X"
        >
          <img src="x.png" alt="X" />
        </a>
      </div>
      <p class="copyright">© 2026 Rymdkraftverk</p>
    </footer>
    <script>
      document.querySelector(".yt-video").addEventListener("click", (e) => {
        const button = e.currentTarget;
        const iframe = document.createElement("iframe");
        iframe.className = "yt-video";
        iframe.src = `https://www.youtube-nocookie.com/embed/${button.dataset.videoId}?autoplay=1`;
        iframe.title = "Hitler reacts to functional programming";
        iframe.allow = "autoplay; fullscreen";
        iframe.allowFullscreen = true;
        button.replaceWith(iframe);
      });
    </script>
  </body>
</html>
