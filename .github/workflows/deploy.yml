name: deploy
on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: fogpipe/cloud-actions/auth@v1
        with:
          service-account: a41e68ad-192a-4d38-aa77-0c65b48c6446

      - run: curl -fsSL https://raw.githubusercontent.com/fogpipe/cloud-cli/main/install.sh | sh

      - run: fpcloud website deploy website web --org rkv --project games
